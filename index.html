<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSNEX - Bus Management</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  display: grid;
  place-items: center;
  min-height: 100vh;
}
.login {
  background: white;
  padding: 35px;
  border-radius: 15px;
  width: 310px;
  box-shadow: 0 5px 25px #0001;
}
h1 { color: #0f766e; text-align: center; }
p { text-align: center; color: #64748b; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border-radius: 7px;
}
input { border: 1px solid #cbd5e1; }
button {
  border: 0;
  background: #0f766e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="login">
  <h1>BUSNEX</h1>
  <p>Bus Management System</p>
  <input placeholder="User ID">
  <input type="password" placeholder="Password">
  <button>LOGIN</button>
  <p>Authorized Users Only</p>
</div>
</body>
</html>
