
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSNEX | Counter Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b35, #123d64);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px #0005;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #e8f3ff;
      color: #0875cf;
      font-size: 30px;
      font-weight: bold;
    }
    h1 {
      text-align: center;
      margin: 0;
      color: #102b48;
      font-size: 30px;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      color: #718096;
      margin: 9px 0 30px;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 17px 0 8px;
      color: #263b50;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dfeb;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }
    input:focus {
      border-color: #0875cf;
      box-shadow: 0 0 0 3px #0875cf18;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #0875cf;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .65;
      cursor: wait;
    }
    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .footer {
      margin-top: 28px;
      text-align: center;
      color: #8291a3;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">B</div>
    <h1>BUSNEX</h1>
    <p class="subtitle">BUS MANAGEMENT SYSTEM<br>Counter Login Portal</p>

    <form id="loginForm">
      <label for="loginId">User ID</label>
      <input id="loginId" type="text"
        placeholder="Enter your User ID"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Enter your password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">LOGIN</button>
      <div id="message" role="status"></div>
    </form>

    <div class="footer">© 2026 BUSNEX · All Rights Reserved</div>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://ikjjmiddgpruufxtyqmd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const FUNCTION_NAME = "clever-service";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const login_id = document.getElementById("loginId")
        .value.trim().toUpperCase();

      const password = document.getElementById("password").value;

      if (SUPABASE_PUBLISHABLE_KEY ===
          "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
        message.textContent = "Publishable Key বসানো হয়নি।";
        return;
      }

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      message.style.color = "#0875cf";
      message.textContent = "লগইন যাচাই করা হচ্ছে...";

      try {
        const { data, error } =
          await supabase.functions.invoke(FUNCTION_NAME, {
            body: { login_id, password }
          });

        if (error) throw error;

        if (!data?.access_token || !data?.refresh_token) {
          throw new Error(
            data?.error || "লগইন তথ্য যাচাই করা যায়নি।"
          );
        }

        const { error: sessionError } =
          await supabase.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });

        if (sessionError) throw sessionError;

        message.style.color = "green";
        message.textContent = "লগইন সফল হয়েছে!";

      } catch (error) {
        console.error("BUSNEX login error:", error);
        message.style.color = "#d62828";
        message.textContent =
          "লগইন হয়নি। User ID, Password অথবা সার্ভার পরীক্ষা করুন।";
      } finally {
        button.disabled = false;
        button.textContent = "LOGIN";
      }
    });
  </script>
</body>
</html>
